<svg xmlns="http://www.w3.org/2000/svg" width="380" height="96" viewBox="0 0 380 96" fill="none">
  <defs>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#FFA116" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#30363d"/>
      <stop offset="1" stop-color="#30363d"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFA116" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFA116" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="2" y="2" width="376" height="92" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .shine { animation: sweep 4.5s ease-in-out 1.2s infinite; }
    @keyframes sweep { 0% { transform: translateX(-160px); } 35%, 100% { transform: translateX(420px); } }
    .halo { animation: breathe 3s ease-in-out 1.2s infinite; transform-origin: 48px 48px; }
    @keyframes breathe { 0%,100% { opacity: .55; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.08); } }
    .arrow { animation: nudge 2.4s ease-in-out 1.2s infinite; }
    @keyframes nudge { 0%,100% { transform: translate(0,0); } 50% { transform: translate(3px,-3px); } }
  </style>
  <rect x="2" y="2" width="376" height="92" rx="18" fill="#0d1117" stroke="url(#edge)" stroke-width="2"/>
  <g clip-path="url(#clip)"><rect class="shine" x="0" y="0" width="120" height="96" fill="url(#shine)"/></g>
  <circle class="halo" cx="48" cy="48" r="34" fill="url(#halo)"/>
  <rect x="24" y="24" width="48" height="48" rx="12" fill="#11151c" stroke="#FFA116" stroke-opacity=".55" stroke-width="1.5"/>
  <g transform="translate(34 34) scale(1.1667)"><path d="M13.483 0a1.374 1.374 0 0 0-.961.438L7.116 6.226l-3.854 4.126a5.266 5.266 0 0 0-1.209 2.104 5.35 5.35 0 0 0-.125.513 5.527 5.527 0 0 0 .062 2.362 5.83 5.83 0 0 0 .349 1.017 5.938 5.938 0 0 0 1.271 1.818l4.277 4.193.039.038c2.248 2.165 5.852 2.133 8.063-.074l2.396-2.392c.54-.54.54-1.414.003-1.955a1.378 1.378 0 0 0-1.951-.003l-2.396 2.392a3.021 3.021 0 0 1-4.205.038l-.02-.019-4.276-4.193c-.652-.64-.972-1.469-.948-2.263a2.68 2.68 0 0 1 .066-.523 2.545 2.545 0 0 1 .619-1.164L9.13 8.114c1.058-1.134 3.204-1.27 4.43-.278l3.501 2.831c.593.48 1.461.387 1.94-.207a1.384 1.384 0 0 0-.207-1.943l-3.5-2.831c-.8-.647-1.766-1.045-2.774-1.202l2.015-2.158A1.384 1.384 0 0 0 13.483 0zm-2.866 12.815a1.38 1.38 0 0 0-1.38 1.382 1.38 1.38 0 0 0 1.38 1.382H20.79a1.38 1.38 0 0 0 1.38-1.382 1.38 1.38 0 0 0-1.38-1.382z" fill="#FFA116"/></g>
