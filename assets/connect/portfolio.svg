<svg xmlns="http://www.w3.org/2000/svg" width="380" height="96" viewBox="0 0 380 96" fill="none">
  <defs>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#b48cff" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#30363d"/>
      <stop offset="1" stop-color="#30363d"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b48cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#b48cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="2" y="2" width="376" height="92" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .shine { animation: sweep 4.5s ease-in-out 0.0s infinite; }
    @keyframes sweep { 0% { transform: translateX(-160px); } 35%, 100% { transform: translateX(420px); } }
    .halo { animation: breathe 3s ease-in-out 0.0s infinite; transform-origin: 48px 48px; }
    @keyframes breathe { 0%,100% { opacity: .55; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.08); } }
    .arrow { animation: nudge 2.4s ease-in-out 0.0s infinite; }
    @keyframes nudge { 0%,100% { transform: translate(0,0); } 50% { transform: translate(3px,-3px); } }
  </style>
  <rect x="2" y="2" width="376" height="92" rx="18" fill="#0d1117" stroke="url(#edge)" stroke-width="2"/>
  <g clip-path="url(#clip)"><rect class="shine" x="0" y="0" width="120" height="96" fill="url(#shine)"/></g>
  <circle class="halo" cx="48" cy="48" r="34" fill="url(#halo)"/>
  <rect x="24" y="24" width="48" height="48" rx="12" fill="#11151c" stroke="#b48cff" stroke-opacity=".55" stroke-width="1.5"/>
  <g transform="translate(34 34) scale(1.1667)"><path d="M12 0C8.21 0 4.831 1.757 2.632 4.501l3.953 6.848A5.454 5.454 0 0 1 12 6.545h10.691A12 12 0 0 0 12 0zM1.931 5.47A11.943 11.943 0 0 0 0 12c0 6.012 4.42 10.991 10.189 11.864l3.953-6.847a5.45 5.45 0 0 1-6.865-2.29zm13.342 2.166a5.446 5.446 0 0 1 1.45 7.09l.002.001h-.002l-5.344 9.257c.206.01.413.016.621.016 6.627 0 12-5.373 12-12 0-1.54-.29-3.011-.818-4.364zM12 16.364a4.364 4.364 0 1 1 0-8.728 4.364 4.364 0 0 1 0 8.728Z" fill="#e6edf3"/></g>
  <text x="92" y="45" fill="#e6edf3" font-size="22" font-weight="700">Portfolio</text>
  <text x="92" y="70" fill="#6e7681" font-size="15">view my work</text>
  <g class="arrow"><path d="M330 56 L346 40 M334 40 H346 V52" stroke="#b48cff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
