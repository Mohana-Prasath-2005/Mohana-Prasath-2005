<svg xmlns="http://www.w3.org/2000/svg" width="380" height="96" viewBox="0 0 380 96" fill="none">
  <defs>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#EA4335" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#30363d"/>
      <stop offset="1" stop-color="#30363d"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#EA4335" stop-opacity=".45"/>
      <stop offset="1" stop-color="#EA4335" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="2" y="2" width="376" height="92" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .shine { animation: sweep 4.5s ease-in-out 1.8s infinite; }
    @keyframes sweep { 0% { transform: translateX(-160px); } 35%, 100% { transform: translateX(420px); } }
    .halo { animation: breathe 3s ease-in-out 1.8s infinite; transform-origin: 48px 48px; }
    @keyframes breathe { 0%,100% { opacity: .55; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.08); } }
    .arrow { animation: nudge 2.4s ease-in-out 1.8s infinite; }
    @keyframes nudge { 0%,100% { transform: translate(0,0); } 50% { transform: translate(3px,-3px); } }
  </style>
  <rect x="2" y="2" width="376" height="92" rx="18" fill="#0d1117" stroke="url(#edge)" stroke-width="2"/>
  <g clip-path="url(#clip)"><rect class="shine" x="0" y="0" width="120" height="96" fill="url(#shine)"/></g>
  <circle class="halo" cx="48" cy="48" r="34" fill="url(#halo)"/>
  <rect x="24" y="24" width="48" height="48" rx="12" fill="#11151c" stroke="#EA4335" stroke-opacity=".55" stroke-width="1.5"/>
  <g transform="translate(34 34) scale(1.1667)"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#EA4335"/></g>
  <text x="92" y="45" fill="#e6edf3" font-size="22" font-weight="700">Email</text>
  <text x="92" y="70" fill="#6e7681" font-size="15">say hello</text>
  <g class="arrow"><path d="M330 56 L346 40 M334 40 H346 V52" stroke="#EA4335" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
