<svg xmlns="http://www.w3.org/2000/svg" width="380" height="96" viewBox="0 0 380 96" fill="none">
  <defs>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#0A66C2" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#30363d"/>
      <stop offset="1" stop-color="#30363d"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0A66C2" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0A66C2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="2" y="2" width="376" height="92" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .shine { animation: sweep 4.5s ease-in-out 0.6s infinite; }
    @keyframes sweep { 0% { transform: translateX(-160px); } 35%, 100% { transform: translateX(420px); } }
    .halo { animation: breathe 3s ease-in-out 0.6s infinite; transform-origin: 48px 48px; }
    @keyframes breathe { 0%,100% { opacity: .55; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.08); } }
    .arrow { animation: nudge 2.4s ease-in-out 0.6s infinite; }
    @keyframes nudge { 0%,100% { transform: translate(0,0); } 50% { transform: translate(3px,-3px); } }
  </style>
  <rect x="2" y="2" width="376" height="92" rx="18" fill="#0d1117" stroke="url(#edge)" stroke-width="2"/>
  <g clip-path="url(#clip)"><rect class="shine" x="0" y="0" width="120" height="96" fill="url(#shine)"/></g>
  <circle class="halo" cx="48" cy="48" r="34" fill="url(#halo)"/>
  <rect x="24" y="24" width="48" height="48" rx="12" fill="#11151c" stroke="#0A66C2" stroke-opacity=".55" stroke-width="1.5"/>
  <g transform="translate(34 34) scale(1.1667)"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" fill="#0A66C2"/></g>
  <text x="92" y="45" fill="#e6edf3" font-size="22" font-weight="700">LinkedIn</text>
  <text x="92" y="70" fill="#6e7681" font-size="15">let's connect</text>
  <g class="arrow"><path d="M330 56 L346 40 M334 40 H346 V52" stroke="#0A66C2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
