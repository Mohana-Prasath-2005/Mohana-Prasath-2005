    @keyframes ping { 0% { opacity: .8; transform: scale(1); } 100% { opacity: 0; transform: scale(3.2); } }
    .flame { animation: flick 1.4s ease-in-out infinite; }
    @keyframes flick { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
