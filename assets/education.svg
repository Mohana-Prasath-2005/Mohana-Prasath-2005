<svg fill="none" viewBox="0 0 900 346" width="900" height="346" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .wrap {
          background: #0d1117;
          border: 1px solid #21262d;
          border-radius: 12px;
          padding: 18px 20px 20px;
          font-family: 'JetBrains Mono', 'Courier New', monospace;
        }

        .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
        .head .cmd { font-size: 13px; color: #00BFFF; }
        .head .cmd b { color: #8A2BE2; font-weight: 400; }
        .head .meta { font-size: 10px; color: #6e7681; letter-spacing: 1.5px; }

        .grid { display: grid; grid-template-columns: 1fr .88fr 1.27fr; gap: 14px; }

        .panel {
          background: #11151c;
          border: 1px solid #21262d;
          border-radius: 12px;
          padding: 16px;
          height: 270px;
          position: relative;
          overflow: hidden;
          opacity: 0;
          animation: rise .7s ease-out forwards;
        }
        .panel:nth-child(2) { animation-delay: .2s; }
        .panel:nth-child(3) { animation-delay: .4s; }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        .cap { font-size: 9.5px; color: #6e7681; letter-spacing: 1.8px; }

        /* degree */
        .deg { margin-top: 12px; color: #e6edf3; font-size: 15px; font-weight: 800; line-height: 1.3; }
        .deg span { color: #b48cff; }
        .uni { margin-top: 6px; color: #8b949e; font-size: 11px; }

        .ringrow { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
        .ring {
          width: 74px; height: 74px; border-radius: 50%; flex-shrink: 0;
          background: conic-gradient(#8A2BE2 0deg, #00BFFF 327.6deg, #21262d 327.6deg);
          display: flex; align-items: center; justify-content: center;
          animation: spin-in 1.4s cubic-bezier(.2,.8,.2,1) .4s both;
          box-shadow: 0 0 22px rgba(138,43,226,.25);
        }
        @keyframes spin-in { from { transform: rotate(-120deg); opacity: 0; } to { transform: none; opacity: 1; } }
        .ring div {
          width: 60px; height: 60px; border-radius: 50%; background: #11151c;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .ring b { font-size: 17px; font-weight: 800; color: #e6edf3; }
        .ring i { font-style: normal; font-size: 8px; color: #6e7681; letter-spacing: 1px; }
        .rinfo { font-size: 10.5px; color: #8b949e; line-height: 1.6; }
        .rinfo strong { color: #e6edf3; }

        .tl { position: absolute; left: 16px; right: 16px; bottom: 16px; }
        .tl .yrs { display: flex; justify-content: space-between; font-size: 9.5px; color: #6e7681; margin-bottom: 6px; }
        .tl .yrs b { color: #3fb950; font-weight: 700; }
        .track { position: relative; height: 4px; border-radius: 2px; background: #21262d; }
        .track .fill {
          position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 2px;
          background: linear-gradient(90deg, #8A2BE2, #00BFFF, #3fb950);
          transform-origin: left; animation: grow 1.8s cubic-bezier(.2,.8,.2,1) .6s both;
        }
        @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
        .track .cap-dot {
          position: absolute; right: -5px; top: -4px; width: 12px; height: 12px; border-radius: 50%;
          background: #3fb950; box-shadow: 0 0 0 0 rgba(63,185,80,.6); animation: ping 2s ease-out 2.4s infinite;
        }
        @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(63,185,80,.6); } 100% { box-shadow: 0 0 0 9px rgba(63,185,80,0); } }

        /* trend */
        .bars { position: absolute; left: 16px; right: 16px; bottom: 34px; height: 150px; display: flex; align-items: flex-end; gap: 8px; }
        .bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
        .bar .v { font-size: 9px; color: #8b949e; margin-bottom: 5px; opacity: 0; animation: fade .5s ease-out forwards; }
        .bar .col {
          width: 100%; border-radius: 4px 4px 2px 2px;
          background: linear-gradient(180deg, #00BFFF, #8A2BE2);
          transform-origin: bottom; animation: up 1s cubic-bezier(.2,.8,.2,1) both;
          box-shadow: 0 0 12px rgba(0,191,255,.18);
        }
        .bar.top .col { background: linear-gradient(180deg, #3fb950, #00BFFF); box-shadow: 0 0 14px rgba(63,185,80,.35); }
        .bar.top .v { color: #3fb950; font-weight: 700; }
        @keyframes up { from { transform: scaleY(0); } to { transform: scaleY(1); } }
        @keyframes fade { to { opacity: 1; } }
        .sems { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 8px; }
        .sems span { flex: 1; text-align: center; font-size: 9px; color: #6e7681; }

        /* honours */
        .hon { margin-top: 11px; display: flex; flex-direction: column; gap: 6px; }
        .h {
          display: flex; align-items: center; gap: 10px;
          background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 6px 10px;
          opacity: 0; animation: slide .5s ease-out forwards;
        }
        .h:nth-child(1) { animation-delay: .6s; } .h:nth-child(2) { animation-delay: .75s; }
        .h:nth-child(3) { animation-delay: .9s; } .h:nth-child(4) { animation-delay: 1.05s; }
        .h:nth-child(5) { animation-delay: 1.2s; }
        @keyframes slide { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: none; } }
        .medal {
          width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; position: relative;
          background: radial-gradient(circle at 35% 30%, #fff6c8, var(--m) 55%, #6b4e00);
          box-shadow: 0 0 10px color-mix(in srgb, var(--m) 50%, transparent);
        }
        .medal.shine { animation: glint 3s ease-in-out infinite; }
        @keyframes glint { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }
        .ht { flex: 1; min-width: 0; }
        .ht b { display: block; font-size: 10.5px; color: #e6edf3; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ht i { display: block; font-style: normal; font-size: 9px; color: #6e7681; margin-top: 1px; white-space: nowrap; }
        .yr { font-size: 9.5px; color: #f2cc60; }
      </style>

      <div class="wrap">
        <div class="head">
          <span class="cmd"><b>❯ </b>cat ~/education.log</span>
          <span class="meta">CLASS OF 2026 · HONOURS</span>
        </div>

        <div class="grid">

          <div class="panel">
            <div class="cap">DEGREE</div>
            <div class="deg">B.E. Computer Science <span>&amp;</span> Engineering</div>
            <div class="uni">Nandha Engineering College · Erode</div>
            <div class="ringrow">
              <div class="ring"><div><b>9.10</b><i>CGPA</i></div></div>
              <div class="rinfo"><strong>9+ throughout</strong><br/>cumulative CGPA<br/>till semester VII</div>
            </div>
            <div class="tl">
              <div class="yrs"><span>2022</span><b>2026 · graduated</b></div>
              <div class="track"><div class="fill"></div><div class="cap-dot"></div></div>
            </div>
          </div>

          <div class="panel">
            <div class="cap">CGPA TREND · SEM I → VII</div>
            <div class="bars">
              <div class="bar"><span class="v" style="animation-delay:1.0s">9.14</span><div class="col" style="height:57%; animation-delay:.30s"></div></div>
              <div class="bar"><span class="v" style="animation-delay:1.1s">9.04</span><div class="col" style="height:52%; animation-delay:.38s"></div></div>
              <div class="bar"><span class="v" style="animation-delay:1.2s">9.22</span><div class="col" style="height:61%; animation-delay:.46s"></div></div>
              <div class="bar top"><span class="v" style="animation-delay:1.3s">9.29</span><div class="col" style="height:64%; animation-delay:.54s"></div></div>
              <div class="bar"><span class="v" style="animation-delay:1.4s">9.23</span><div class="col" style="height:61%; animation-delay:.62s"></div></div>
              <div class="bar"><span class="v" style="animation-delay:1.5s">9.20</span><div class="col" style="height:60%; animation-delay:.70s"></div></div>
              <div class="bar"><span class="v" style="animation-delay:1.6s">9.10</span><div class="col" style="height:55%; animation-delay:.78s"></div></div>
            </div>
            <div class="sems"><span>I</span><span>II</span><span>III</span><span>IV</span><span>V</span><span>VI</span><span>VII</span></div>
          </div>

          <div class="panel">
            <div class="cap">HONOURS &amp; ROLES</div>
            <div class="hon">
              <div class="h"><div class="medal shine" style="--m:#f2cc60"></div><div class="ht"><b>ISTE Chapter Best Student</b><i>ISTE Tamil Nadu Section</i></div><span class="yr">2026</span></div>
              <div class="h"><div class="medal shine" style="--m:#f2cc60"></div><div class="ht"><b>Best Outgoing Student</b><i>Dept. of CSE</i></div><span class="yr">2026</span></div>
              <div class="h"><div class="medal" style="--m:#c0c8d2"></div><div class="ht"><b>Best Co-Curricular Student</b><i>CSE · two years running</i></div><span class="yr">'25 '26</span></div>
              <div class="h"><div class="medal" style="--m:#b48cff"></div><div class="ht"><b>Board of Studies Member</b><i>Dept. of CSE</i></div><span class="yr">2022–</span></div>
              <div class="h"><div class="medal" style="--m:#00BFFF"></div><div class="ht"><b>Student Secretary</b><i>Dept. of CSE</i></div><span class="yr">2025–26</span></div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </foreignObject>
</svg>
