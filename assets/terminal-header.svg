<svg fill="none" viewBox="0 0 900 380" width="900" height="380" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .terminal {
          background: #0d1117;
          border: 1px solid #21262d;
          border-radius: 12px;
          overflow: hidden;
          font-family: 'JetBrains Mono', 'Courier New', monospace;
          box-shadow: 0 0 40px rgba(138, 43, 226, 0.10), 0 0 80px rgba(0, 191, 255, 0.05);
        }

        .titlebar {
          background: linear-gradient(90deg, #11151c 0%, #161b22 100%);
          padding: 10px 16px;
          display: flex;
          align-items: center;
          gap: 8px;
          border-bottom: 1px solid #21262d;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-red { background: #ff5f57; }
        .dot-yellow { background: #febc2e; }
        .dot-green { background: #28c840; }

        .titlebar-text { color: #6e7681; font-size: 11px; margin-left: 8px; letter-spacing: 0.5px; }

        .body { padding: 24px 28px; display: flex; gap: 32px; }
        .left { flex: 1.05; }
        .right { flex: 1; }

        .prompt { color: #8A2BE2; font-size: 13px; }
        .cmd { color: #00BFFF; font-size: 13px; }
        .output { color: #8b949e; font-size: 12px; line-height: 1.85; margin-top: 8px; }
        .highlight { color: #b48cff; font-weight: 700; }
        .cyan { color: #00BFFF; }
        .green { color: #3fb950; }
        .yellow { color: #f2cc60; }
        .white { color: #e6edf3; }
        .dim { color: #6e7681; }

        .name {
          font-size: 28px;
          font-weight: 700;
          background: linear-gradient(135deg, #b48cff, #00BFFF);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          margin-bottom: 4px;
          animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
          from { filter: drop-shadow(0 0 2px rgba(138, 43, 226, 0.35)); }
          to { filter: drop-shadow(0 0 8px rgba(0, 191, 255, 0.45)); }
        }

        .tagline { color: #8b949e; font-size: 12px; margin-bottom: 14px; font-style: italic; }

        .separator {
          border: none;
          height: 1px;
          background: linear-gradient(90deg, transparent, #30363d, transparent);
          margin: 12px 0;
        }

        .stat-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; gap: 12px; }
        .stat-label { color: #6e7681; }

        .log { font-size: 11.5px; line-height: 1.85; color: #8b949e; }

        .cursor-blink {
          display: inline-block;
          width: 8px;
          height: 14px;
          background: #8A2BE2;
          animation: blink 1s step-end infinite;
          vertical-align: middle;
          margin-left: 2px;
        }

        @keyframes blink { 50% { opacity: 0; } }

        .status-dot {
          display: inline-block;
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: #3fb950;
          animation: pulse 2s ease-in-out infinite;
          margin-right: 6px;
          vertical-align: middle;
        }

        @keyframes pulse {
          0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.4); }
          50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(63, 185, 80, 0); }
        }

        .fade-in { animation: fadeIn 0.8s ease-out forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
        .delay-4 { animation-delay: 0.8s; }
        .delay-5 { animation-delay: 1.0s; }

        @keyframes fadeIn { to { opacity: 1; } }
      </style>

      <div class="terminal">
        <div class="titlebar">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
          <span class="titlebar-text">mohan@github ~ /home/mohana-prasath</span>
        </div>

        <div class="body">
          <div class="left">
            <div class="fade-in delay-1">
              <span class="prompt">❯ </span><span class="cmd">whoami</span><span class="cursor-blink"></span>
            </div>

            <div class="fade-in delay-2" style="margin-top: 16px;">
              <div class="name">Mohana Prasath G</div>
              <div class="tagline">"I build backends that move money."</div>
            </div>

            <hr class="separator fade-in delay-3" />

            <div class="output fade-in delay-3">
              <span class="highlight">→</span> Software Engineer <span class="cyan">@ Open Fabric</span><br/>
              <span class="highlight">→</span> Fintech · Card Issuing · Payments Infra<br/>
              <span class="highlight">→</span> AWS Serverless · Event-Driven Systems<br/>
              <span class="highlight">→</span> AI Research · Multimodal Emotion Recognition<br/>
              <span class="highlight">→</span> <span class="yellow">490+</span> LeetCode Problems Solved
            </div>

            <hr class="separator fade-in delay-4" />

            <div class="fade-in delay-5" style="font-size: 12px;">
              <span class="status-dot"></span>
              <span class="green">shipping to production</span>
              <span class="dim"> · </span>
              <span class="cyan">open to collaborate</span>
            </div>
          </div>

          <div class="right">
            <div class="fade-in delay-3">
              <div class="output" style="margin-top: 0;">
                <span class="prompt">❯ </span><span class="cmd">cat skills.conf</span>
              </div>
              <div style="margin-top: 12px;">
                <div class="stat-row"><span class="stat-label">backend</span><span class="cyan">TypeScript · Node · Go · Flask</span></div>
                <div class="stat-row"><span class="stat-label">cloud</span><span class="cyan">AWS · Lambda · CDK · Docker</span></div>
                <div class="stat-row"><span class="stat-label">data</span><span class="cyan">PostgreSQL · GraphQL · Hasura</span></div>
                <div class="stat-row"><span class="stat-label">ai/ml</span><span class="cyan">PyTorch · DINOv2 · YOLOv8</span></div>
                <div class="stat-row"><span class="stat-label">frontend</span><span class="cyan">React · Vite · HTML/CSS</span></div>
              </div>
            </div>

            <hr class="separator fade-in delay-4" />

            <div class="fade-in delay-5">
              <div class="output" style="margin-top: 0;">
                <span class="prompt">❯ </span><span class="cmd">tail -n 4 shipped.log</span>
              </div>
              <div class="log" style="margin-top: 10px;">
                <span class="green">✔</span> <span class="white">webhooks</span> — OAuth2 + HMAC signing, per-endpoint retry<br/>
                <span class="green">✔</span> <span class="white">chargebacks</span> — dispute &amp; reversal lifecycle<br/>
                <span class="green">✔</span> <span class="white">audit logs</span> — multi-tenant audit trail<br/>
                <span class="green">✔</span> <span class="white">adapters</span> — ledger connectivity probes (Go)
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
