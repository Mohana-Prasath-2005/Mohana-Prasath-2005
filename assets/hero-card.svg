<svg fill="none" viewBox="0 0 900 266" width="900" height="266" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .frame {
          background: #0d1117;
          border: 1px solid #21262d;
          border-radius: 12px;
          overflow: hidden;
          font-family: 'JetBrains Mono', 'Courier New', monospace;
          position: relative;
          box-shadow: 0 0 40px rgba(138, 43, 226, 0.10), 0 0 80px rgba(0, 191, 255, 0.05);
        }

        .grid-bg {
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(rgba(138, 43, 226, 0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(138, 43, 226, 0.06) 1px, transparent 1px);
          background-size: 24px 24px;
          mask-image: radial-gradient(ellipse at 85% 30%, #000 0%, transparent 70%);
          -webkit-mask-image: radial-gradient(ellipse at 85% 30%, #000 0%, transparent 70%);
        }

        .titlebar {
          position: relative;
          background: linear-gradient(90deg, #11151c 0%, #161b22 100%);
          padding: 10px 16px;
          display: flex;
          align-items: center;
          gap: 8px;
          border-bottom: 1px solid #21262d;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .titlebar-text { color: #6e7681; font-size: 11px; margin-left: 8px; letter-spacing: 0.5px; flex: 1; }
        .live { color: #3fb950; font-size: 10px; letter-spacing: 1.5px; }
        .live i {
          display: inline-block; width: 6px; height: 6px; border-radius: 50%;
          background: #3fb950; margin-right: 6px; vertical-align: middle;
          animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
          0%, 100% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.5); }
          50% { box-shadow: 0 0 0 4px rgba(63, 185, 80, 0); }
        }

        .body { position: relative; display: flex; padding: 26px 28px 22px; gap: 26px; }
        .left { flex: 1.1; }
        .right { flex: 1; }

        .prompt { color: #8A2BE2; font-size: 13px; }
        .cmd { color: #00BFFF; font-size: 13px; }

        .cursor {
          display: inline-block; width: 8px; height: 14px; background: #8A2BE2;
          vertical-align: middle; margin-left: 3px; animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .name {
          margin-top: 16px;
          font-size: 34px;
          font-weight: 800;
          letter-spacing: -0.5px;
          line-height: 1.15;
          background: linear-gradient(90deg, #b48cff, #00BFFF, #3fb950, #b48cff);
          background-size: 300% 100%;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          animation: sweep 6s linear infinite;
        }
        @keyframes sweep { to { background-position: 300% 0; } }

        .rotator {
          margin-top: 12px;
          height: 22px;
          overflow: hidden;
          font-size: 14px;
          border-left: 2px solid #8A2BE2;
          padding-left: 10px;
        }
        .reel { animation: roll 15s cubic-bezier(.7,0,.3,1) infinite; }
        .reel div { height: 22px; line-height: 22px; color: #e6edf3; white-space: nowrap; }
        .reel span { color: #00BFFF; }
        @keyframes roll {
          0%, 16%   { transform: translateY(0); }
          20%, 36%  { transform: translateY(-22px); }
          40%, 56%  { transform: translateY(-44px); }
          60%, 76%  { transform: translateY(-66px); }
          80%, 96%  { transform: translateY(-88px); }
          100%      { transform: translateY(-110px); }
        }

        .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 24px; }
        .tile {
          background: rgba(17, 21, 28, 0.85);
          border: 1px solid #21262d;
          border-radius: 8px;
          padding: 9px 11px;
          opacity: 0;
          animation: rise 0.6s ease-out forwards;
        }
        .tile:nth-child(1) { border-left: 2px solid #8A2BE2; animation-delay: 0.2s; }
        .tile:nth-child(2) { border-left: 2px solid #00BFFF; animation-delay: 0.35s; }
        .tile:nth-child(3) { border-left: 2px solid #f2cc60; animation-delay: 0.5s; }
        .tile:nth-child(4) { border-left: 2px solid #3fb950; animation-delay: 0.65s; }
        .tk { color: #6e7681; font-size: 9.5px; letter-spacing: 1.2px; text-transform: uppercase; }
        .tv { color: #e6edf3; font-size: 12px; font-weight: 700; margin-top: 3px; }
        @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

      </style>

      <div class="frame">
        <div class="grid-bg"></div>

        <div class="titlebar">
          <div class="dot" style="background:#ff5f57"></div>
          <div class="dot" style="background:#febc2e"></div>
          <div class="dot" style="background:#28c840"></div>
          <span class="titlebar-text">mohan@github ~ /home/mohana-prasath</span>
          <span class="live"><i></i>LIVE</span>
        </div>

        <div class="body">
          <div class="left">
            <div><span class="prompt">❯ </span><span class="cmd">whoami</span><span class="cursor"></span></div>

            <div class="name">Mohana Prasath G</div>

            <div class="rotator">
              <div class="reel">
                <div>Software Engineer <span>@ Open Fabric</span></div>
                <div>Alumnus <span>@ NEC</span> <span style="color:#6e7681">· Class of 2026</span></div>
                <div>Exploring <span>→</span> System Design <span>·</span> Distributed Systems</div>
                <div>AI Research <span>·</span> Multimodal Emotion</div>
                <div>Fintech <span>·</span> Card Issuing <span>·</span> Payments</div>
                <div>Software Engineer <span>@ Open Fabric</span></div>
              </div>
            </div>

            <div class="tiles">
              <div class="tile"><div class="tk">focus</div><div class="tv">Backend Systems</div></div>
              <div class="tile"><div class="tk">domain</div><div class="tv">Payments Infra</div></div>
              <div class="tile"><div class="tk">exploring</div><div class="tv">System Design</div></div>
              <div class="tile"><div class="tk">research</div><div class="tv">Multimodal AI</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
