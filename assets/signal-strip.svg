<svg fill="none" viewBox="0 0 900 84" width="900" height="84" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .strip {
          position: relative;
          height: 82px;
          background: #0d1117;
          border: 1px solid #21262d;
          border-radius: 12px;
          overflow: hidden;
          display: flex;
          align-items: stretch;
          font-family: 'JetBrains Mono', 'Courier New', monospace;
        }

        .beam {
          position: absolute; left: 0; bottom: 0; height: 2px; width: 180px;
          background: linear-gradient(90deg, transparent, #8A2BE2, #00BFFF, transparent);
          animation: beam 5s ease-in-out infinite;
        }
        @keyframes beam { 0% { transform: translateX(-200px); } 100% { transform: translateX(920px); } }

        .seg {
          flex: 1;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 0 18px;
          position: relative;
          opacity: 0;
          animation: in .6s ease-out forwards;
        }
        .seg + .seg::before {
          content: ''; position: absolute; left: 0; top: 18px; bottom: 18px; width: 1px;
          background: linear-gradient(180deg, transparent, #30363d, transparent);
        }
        .seg:nth-child(2) { animation-delay: .05s; } .seg:nth-child(3) { animation-delay: .15s; }
        .seg:nth-child(4) { animation-delay: .25s; } .seg:nth-child(5) { animation-delay: .35s; }
        .seg:nth-child(6) { animation-delay: .45s; }
        @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

        .k { display: flex; align-items: center; gap: 6px; font-size: 9px; letter-spacing: 1.8px; color: #6e7681; }
        .k i { width: 6px; height: 6px; border-radius: 1.5px; background: var(--c); box-shadow: 0 0 8px var(--c); }
        .v { margin-top: 7px; font-size: 13px; font-weight: 700; color: #e6edf3; white-space: nowrap; }
        .v span { color: var(--c); }
        .s { margin-top: 3px; font-size: 9.5px; color: #484f58; white-space: nowrap; }

        .live .v { display: flex; align-items: center; gap: 8px; color: #3fb950; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; animation: ping 1.8s ease-out infinite; }
        @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(63,185,80,.6); } 100% { box-shadow: 0 0 0 9px rgba(63,185,80,0); } }
      </style>

      <div class="strip">
        <div class="beam"></div>

        <div class="seg" style="--c:#b48cff">
          <div class="k"><i></i>BASE</div>
          <div class="v">Erode, <span>IN</span></div>
          <div class="s">IST · UTC+5:30</div>
        </div>

        <div class="seg" style="--c:#00BFFF">
          <div class="k"><i></i>BUILDING AT</div>
          <div class="v">Open <span>Fabric</span></div>
          <div class="s">card issuing · payments</div>
        </div>

        <div class="seg" style="--c:#f2cc60">
          <div class="k"><i></i>RESEARCH</div>
          <div class="v"><span>2</span> papers</div>
          <div class="s">published · multimodal AI</div>
        </div>

        <div class="seg" style="--c:#FFA116">
          <div class="k"><i></i>LEETCODE</div>
          <div class="v"><span>490+</span> solved</div>
          <div class="s">easy · medium · hard</div>
        </div>

        <div class="seg live" style="--c:#3fb950">
          <div class="k"><i></i>STATUS</div>
          <div class="v"><div class="dot"></div>available</div>
          <div class="s">open to collaborate</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
