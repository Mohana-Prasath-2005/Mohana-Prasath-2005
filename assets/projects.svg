<svg fill="none" viewBox="0 0 900 430" width="900" height="430" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .wrap {
          background: #0d1117;
          border: 1px solid #21262d;
          border-radius: 12px;
          padding: 18px 20px 20px;
          font-family: 'JetBrains Mono', 'Courier New', monospace;
        }

        .head { font-size: 13px; margin-bottom: 14px; }
        .prompt { color: #8A2BE2; }
        .cmd { color: #00BFFF; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        .card {
          background: #11151c;
          border: 1px solid #21262d;
          border-radius: 10px;
          padding: 14px 16px;
          height: 168px;
          display: flex;
          flex-direction: column;
          opacity: 0;
          animation: rise 0.7s ease-out forwards;
        }

        .c1 { border-top: 2px solid #8A2BE2; animation-delay: 0.1s; }
        .c2 { border-top: 2px solid #00BFFF; animation-delay: 0.3s; }
        .c3 { border-top: 2px solid #3fb950; animation-delay: 0.5s; }
        .c4 { border-top: 2px solid #f2cc60; animation-delay: 0.7s; }

        @keyframes rise {
          from { opacity: 0; transform: translateY(6px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .title { color: #e6edf3; font-size: 14px; font-weight: 700; }
        .kind { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; margin: 3px 0 8px; }
        .k1 { color: #b48cff; } .k2 { color: #00BFFF; } .k3 { color: #3fb950; } .k4 { color: #f2cc60; }
        .desc { color: #8b949e; font-size: 11px; line-height: 1.6; flex: 1; }
        .hl { color: #e6edf3; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .tag { font-size: 10px; color: #8b949e; border: 1px solid #30363d; border-radius: 4px; padding: 2px 6px; }
      </style>

      <div class="wrap">
        <div class="head"><span class="prompt">❯ </span><span class="cmd">ls ~/projects --featured</span></div>
        <div class="grid">
          <div class="card c1">
            <div class="title">wavDINO · Temporal</div>
            <div class="kind k1">AI research</div>
            <div class="desc">Multimodal emotion recognition fusing <span class="hl">speech + facial</span> signals. Extends single-frame DINOv2 encoding to <span class="hl">temporal attention over 8–16 frames</span> to capture emotional transitions.</div>
            <div class="tags"><span class="tag">PyTorch</span><span class="tag">DINOv2</span><span class="tag">Transformers</span><span class="tag">React</span></div>
          </div>
          <div class="card c2">
            <div class="title">Transaction Reconciliation</div>
            <div class="kind k2">fintech · full stack</div>
            <div class="desc">End-to-end platform that <span class="hl">matches settlements against transactions</span>, flags mismatches, and surfaces them on real-time dashboards.</div>
            <div class="tags"><span class="tag">Flask</span><span class="tag">SQLite</span><span class="tag">React</span><span class="tag">Vite</span></div>
          </div>
          <div class="card c3">
            <div class="title">Vision X</div>
            <div class="kind k3">computer vision</div>
            <div class="desc">Real-time object detection &amp; counting on webcam or uploaded video at <span class="hl">30 FPS with &lt;50 ms latency</span>, with a live metrics dashboard.</div>
            <div class="tags"><span class="tag">YOLOv8</span><span class="tag">OpenCV</span><span class="tag">Streamlit</span><span class="tag">Python</span></div>
          </div>
          <div class="card c4">
            <div class="title">windmist</div>
            <div class="kind k4">open source · merged PR</div>
            <div class="desc">AI software-engineer CLI in Go. Fixed the editing engine so <span class="hl">multi-line replace &amp; search</span> actually match, plus correct end-column tracking.</div>
            <div class="tags"><span class="tag">Go</span><span class="tag">CLI</span><span class="tag">AI agents</span></div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
